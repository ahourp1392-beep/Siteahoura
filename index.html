<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | نمونه کار</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#080b16;
    color:white;
}

.box{
    width:92%;
    max-width:420px;
    padding:35px;
    border-radius:25px;
    background:#111525;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:#080b16;
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    filter:brightness(1.15);
}

.switch{
    text-align:center;
    color:#999;
    margin-top:20px;
}

.switch span{
    color:#8b5cf6;
    cursor:pointer;
}

.error{
    min-height:22px;
    color:#ff6b6b;
    text-align:center;
    margin-bottom:8px;
}
</style>
</head>

<body>

<div class="box">

    <div id="loginPage">

        <h1>ورود</h1>

        <p class="subtitle">
            وارد حساب خود شوید
        </p>

        <input
            id="loginUsername"
            placeholder="نام کاربری"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="رمز عبور"
        >

        <div id="loginError" class="error"></div>

        <button onclick="login()">
            ورود
        </button>

        <div class="switch">
            حساب ندارید؟
            <span onclick="showSignup()">
                ثبت‌نام
            </span>
        </div>

    </div>


    <div id="signupPage" style="display:none">

        <h1>ثبت‌نام</h1>

        <p class="subtitle">
            حساب جدید بسازید
        </p>

        <input
            id="signupUsername"
            placeholder="نام کاربری"
        >

        <input
            id="signupPassword"
            type="password"
            placeholder="رمز عبور"
        >

        <input
            id="signupPassword2"
            type="password"
            placeholder="تکرار رمز عبور"
        >

        <div id="signupError" class="error"></div>

        <button onclick="signup()">
            ساخت حساب
        </button>

        <div class="switch">
            حساب دارید؟
            <span onclick="showLogin()">
                ورود
            </span>
        </div>

    </div>

</div>


<script>

const ADMIN_USERNAME = "ahourapakpanah";
const ADMIN_PASSWORD = "123456789abcd";


function getUsers(){

    return JSON.parse(
        localStorage.getItem("sample_users") || "[]"
    );

}


function saveUsers(users){

    localStorage.setItem(
        "sample_users",
        JSON.stringify(users)
    );

}


function showSignup(){

    document.getElementById("loginPage").style.display =
        "none";

    document.getElementById("signupPage").style.display =
        "block";

}


function showLogin(){

    document.getElementById("signupPage").style.display =
        "none";

    document.getElementById("loginPage").style.display =
        "block";

}


function login(){

    const username =
        document.getElementById("loginUsername").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("loginError");


    error.innerText = "";


    if(!username || !password){

        error.innerText =
            "نام کاربری و رمز عبور را وارد کنید";

        return;
    }


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        localStorage.setItem(
            "sample_current_user",
            JSON.stringify({
                username:ADMIN_USERNAME,
                role:4
            })
        );

        window.location.href = "shop.html";

        return;
    }


    const users = getUsers();


    const user = users.find(
        u =>
            u.username === username &&
            u.password === password
    );


    if(!user){

        error.innerText =
            "نام کاربری یا رمز عبور اشتباه است";

        return;
    }


    localStorage.setItem(
        "sample_current_user",
        JSON.stringify(user)
    );


    window.location.href =
        "shop.html";

}


function signup(){

    const username =
        document.getElementById("signupUsername").value.trim();

    const password =
        document.getElementById("signupPassword").value;

    const password2 =
        document.getElementById("signupPassword2").value;

    const error =
        document.getElementById("signupError");


    error.innerText = "";


    if(username.length < 3){

        error.innerText =
            "نام کاربری حداقل ۳ حرف باشد";

        return;
    }


    if(password.length < 5){

        error.innerText =
            "رمز عبور حداقل ۵ کاراکتر باشد";

        return;
    }


    if(password !== password2){

        error.innerText =
            "رمزهای عبور یکسان نیستند";

        return;
    }


    const users = getUsers();


    if(
        username === ADMIN_USERNAME ||
        users.some(u => u.username === username)
    ){

        error.innerText =
            "این نام کاربری قبلاً استفاده شده";

        return;
    }


    users.push({

        username:username,

        password:password,

        role:1

    });


    saveUsers(users);


    alert("حساب با موفقیت ساخته شد");


    document.getElementById(
        "loginUsername"
    ).value = username;


    showLogin();

}

</script>

</body>
</html>
