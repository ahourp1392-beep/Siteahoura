<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمونه کار | پنل مدیریت</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial;
background:#080b14;
color:white;
}

header{
height:70px;
padding:0 5%;
display:flex;
align-items:center;
justify-content:space-between;
background:#111827;
border-bottom:1px solid #263244;
}

.logo{
font-size:24px;
font-weight:bold;
color:#a78bfa;
}

button{
border:0;
border-radius:10px;
padding:12px 15px;
cursor:pointer;
color:white;
background:#7c3aed;
}

.logout{
background:#dc2626;
}

.container{
width:min(1000px,92%);
margin:35px auto;
}

.panel{
background:#111827;
padding:25px;
border-radius:22px;
border:1px solid #263244;
margin-bottom:25px;
}

h1,h2{
margin-top:0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
margin-bottom:7px;
color:#cbd5e1;
}

input,textarea{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #334155;
background:#070b14;
color:white;
outline:none;
}

textarea{
min-height:100px;
resize:vertical;
}

.add{
width:100%;
margin-top:15px;
}

.msg{
text-align:center;
margin-top:12px;
min-height:25px;
}

.success{color:#4ade80}
.error{color:#fb7185}

.products{
display:grid;
gap:12px;
}

.item{
display:flex;
align-items:center;
gap:15px;
background:#070b14;
padding:12px;
border-radius:14px;
}

.item img{
width:75px;
height:75px;
object-fit:cover;
border-radius:10px;
}

.info{
flex:1;
}

.price{
color:#67e8f9;
margin-top:5px;
}

.delete{
background:#dc2626;
}

.empty{
text-align:center;
padding:40px;
color:#64748b;
}

@media(max-width:650px){
.grid{
grid-template-columns:1fr;
}
.full{
grid-column:auto;
}
.item{
align-items:flex-start;
}
}
</style>
</head>

<body>

<header>

<div class="logo">
نمونه کار | مدیریت
</div>

<button class="logout" onclick="logout()">
خروج
</button>

</header>


<div class="container">

<div class="panel">

<h1>
پنل مدیریت 👑
</h1>

<p>
از اینجا محصول اضافه کن.
</p>

<div class="grid">

<div>
<label>نام محصول</label>
<input id="name" placeholder="مثلاً رژ لب">
</div>

<div>
<label>قیمت به تومان</label>
<input id="price" type="number" placeholder="500000">
</div>

<div class="full">
<label>توضیحات</label>
<textarea id="description" placeholder="توضیحات محصول"></textarea>
</div>

<div class="full">
<label>عکس محصول</label>
<input id="image" type="file" accept="image/*">
</div>

</div>

<button class="add" onclick="addProduct()">
➕ افزودن محصول
</button>

<div id="msg" class="msg"></div>

</div>


<div class="panel">

<h2>
محصولات موجود
</h2>

<div id="products" class="products"></div>

</div>

</div>


<script>

const currentUser=
JSON.parse(localStorage.getItem("currentUser")||"null");


if(
!currentUser ||
currentUser.role!==4 ||
currentUser.username!=="ahourapakpanah"
){

location.href="index.html";

}


function getProducts(){

return JSON.parse(
localStorage.getItem("products")||"[]"
);

}


function saveProducts(products){

localStorage.setItem(
"products",
JSON.stringify(products)
);

}


function addProduct(){

const name=
document.getElementById("name").value.trim();

const price=
Number(document.getElementById("price").value);

const description=
document.getElementById("description").value.trim();

const file=
document.getElementById("image").files[0];

const msg=
document.getElementById("msg");


if(!name){

msg.className="msg error";
msg.textContent="نام محصول را وارد کن.";
return;

}

if(!price){

msg.className="msg error";
msg.textContent="قیمت را وارد کن.";
return;

}

if(!file){

msg.className="msg error";
msg.textContent="عکس محصول را انتخاب کن.";
return;

}


const reader=new FileReader();


reader.onload=function(e){

const products=getProducts();

products.push({

id:Date.now(),

name:name,

price:price,

description:description||"بدون توضیحات",

image:e.target.result

});


try{

saveProducts(products);

}catch(error){

msg.className="msg error";
msg.textContent="عکس خیلی بزرگ است.";
return;

}


document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("image").value="";

msg.className="msg success";
msg.textContent="محصول با موفقیت اضافه شد ✅";

renderProducts();

};


reader.readAsDataURL(file);

}


function renderProducts(){

const products=getProducts();

const box=document.getElementById("products");

if(products.length===0){

box.innerHTML=`
<div class="empty">
هنوز محصولی اضافه نشده.
</div>
`;

return;

}


box.innerHTML=products.map(product=>`

<div class="item">

<img src="${product.image}">

<div class="info">

<strong>
${escapeHTML(product.name)}
</strong>

<div class="price">
${Number(product.price).toLocaleString("fa-IR")}
تومان
</div>

</div>

<button
class="delete"
onclick="deleteProduct(${product.id})">
حذف
</button>

</div>

`).join("");

}


function deleteProduct(id){

let products=getProducts();

products=products.filter(
product=>product.id!==id
);

saveProducts(products);

renderProducts();

}


function logout(){

localStorage.removeItem("currentUser");

location.href="index.html";

}


function escapeHTML(value){

return String(value).replace(
/[&<>"']/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c])
);

}


renderProducts();

</script>

</body>
</html>
